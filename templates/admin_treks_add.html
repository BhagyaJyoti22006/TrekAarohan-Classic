{% extends "admin_base.html" %}
{% set active_page = "treks" %}

{% block dashboard_content %}
<div class="card" style="max-width: 800px; margin: 0 auto;">
    <div style="margin-bottom: 2rem; border-bottom: 1px solid var(--border-color); padding-bottom: 1rem;">
        <h3 style="margin: 0; color: var(--primary-color);">Create New Trek</h3>
    </div>
    
    <form method="POST" action="{{ url_for('admin_treks_add') }}" enctype="multipart/form-data">
        <div style="display: flex; gap: 1.5rem; margin-bottom: 1rem;">
            <div class="form-group" style="flex: 2; margin-bottom: 0;">
                <label class="form-label">Trek Name</label>
                <input type="text" name="name" class="form-control" required>
            </div>
            <div class="form-group" style="flex: 1; margin-bottom: 0;">
                <label class="form-label">Location</label>
                <input type="text" name="location" class="form-control" required>
            </div>
        </div>

        <div class="form-group">
            <label class="form-label">Description</label>
            <textarea name="description" class="form-control" rows="4" style="resize: vertical;"></textarea>
        </div>
        
        <div style="display: flex; gap: 1.5rem; margin-bottom: 1rem;">
            <div class="form-group" style="flex: 1; margin-bottom: 0;">
                <label class="form-label">Start Date</label>
                <input type="date" name="start_date" class="form-control" required>
            </div>
            <div class="form-group" style="flex: 1; margin-bottom: 0;">
                <label class="form-label">End Date</label>
                <input type="date" name="end_date" class="form-control" required>
            </div>
            <div class="form-group" style="flex: 1; margin-bottom: 0;">
                <label class="form-label">Cover Image</label>
                <input type="file" name="cover_image" class="form-control" accept="image/*">
            </div>
        </div>

        <div style="display: flex; gap: 1.5rem; margin-bottom: 1rem;">
            <div class="form-group" style="flex: 1; margin-bottom: 0;">
                <label class="form-label">Difficulty</label>
                <select name="difficulty" class="form-control" required>
                    <option value="" disabled selected>Select Difficulty</option>
                    <option value="easy">Easy</option>
                    <option value="medium">Medium</option>
                    <option value="hard">Hard</option>
                </select>
            </div>
            <div class="form-group" style="flex: 1; margin-bottom: 0;">
                <label class="form-label">Slots Available</label>
                <input type="number" name="slots_available" class="form-control" min="0" required>
            </div>
            <div class="form-group" style="flex: 1; margin-bottom: 0;">
                <label class="form-label">Price ($)</label>
                <input type="number" name="price" class="form-control" min="0" step="0.01" required>
            </div>
        </div>

        <div class="form-group">
            <label class="form-label">Assign Staff Member</label>
            <select name="assigned_staff_id" class="form-control" required>
                <option value="" disabled selected>Select an approved staff</option>
                {% for s in staff %}
                    <option value="{{ s.id }}">{{ s.name }} ({{ s.username }})</option>
                {% else %}
                    <option value="" disabled>No approved and active staff available</option>
                {% endfor %}
            </select>
            <small style="color: var(--secondary-color); margin-top: 0.5rem; display: block;">Only approved and active staffs shown.</small>
        </div>

        <div style="display: flex; justify-content: flex-end; gap: 1rem; margin-top: 2rem;">
            <a href="{{ url_for('admin_treks') }}" class="btn btn-secondary">Cancel</a>
            <button type="submit" class="btn btn-primary">Create Trek</button>
        </div>
    </form>
</div>
{% endblock %}
