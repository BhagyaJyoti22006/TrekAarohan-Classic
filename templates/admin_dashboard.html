{% extends "admin_base.html" %}
{% set active_page = "dashboard" %}

{% block dashboard_content %}
    <h2>Welcome back, {{ current_user.name }}</h2>
    
    <!-- Quick Stats -->
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1.5rem; margin-top: 2rem; margin-bottom: 3rem;">
        <div class="card" style="text-align: center;">
            <h3 style="color: var(--secondary-color); font-size: 1rem; margin-top: 0;">Total Treks</h3>
            <p style="font-size: 2.5rem; font-weight: bold; margin: 0; color: var(--primary-color);">{{ total_treks }}</p>
        </div>
        <div class="card" style="text-align: center;">
            <h3 style="color: var(--secondary-color); font-size: 1rem; margin-top: 0;">Active Bookings</h3>
            <p style="font-size: 2.5rem; font-weight: bold; margin: 0; color: var(--accent-color);">{{ total_bookings }}</p>
        </div>
        <div class="card" style="text-align: center;">
            <h3 style="color: var(--secondary-color); font-size: 1rem; margin-top: 0;">Total Users</h3>
            <p style="font-size: 2.5rem; font-weight: bold; margin: 0; color: var(--secondary-color);">{{ total_users }}</p>
        </div>
        <div class="card" style="text-align: center;">
            <h3 style="color: var(--secondary-color); font-size: 1rem; margin-top: 0;">Pending Staffs</h3>
            <p style="font-size: 2.5rem; font-weight: bold; margin: 0; color: var(--danger-color);">{{ pending_staffs }}</p>
        </div>
    </div>
{% endblock %}
