{% extends "base.html" %}
{% block public_content %}
<div style="display: flex; justify-content: center; padding-top: 4rem; padding-bottom: 6rem;">
    <div class="card" style="width: 100%; max-width: 400px;">
        <h3 style="margin-top: 0; text-align: center; color: var(--primary-color);">Welcome Back</h3>
        
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div style="padding: 0.75rem; margin-bottom: 1rem; border-radius: 6px; background-color: {% if category == 'error' %}#fee2e2{% else %}#dcfce7{% endif %}; color: {% if category == 'error' %}#991b1b{% else %}#166534{% endif %};">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('login') }}">
            <div class="form-group">
                <label class="form-label">Username</label>
                <input type="text" name="username" class="form-control" required>
            </div>
            <div class="form-group" style="margin-bottom: 1.5rem;">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-accent" style="width: 100%; padding: 1rem; font-size: 1rem;">Sign In</button>
        </form>
        <p style="text-align: center; margin-top: 1.5rem; margin-bottom: 0;">Don't have an account? <a href="{{ url_for('register') }}" style="color: var(--primary-color); font-weight: 500;">Register</a></p>
    </div>
</div>
{% endblock %}
